name: 'Build on debian/ubuntu in container'

on:
  push:
    branches: ["main"]
  pull_request:
      branches: ["main"]
  workflow_call:

jobs:
  linux-container-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ["debian:bookworm", "debian:trixie", "ubuntu:focal", "ubuntu:noble"]
    container:
      image: ghcr.io/watem-sedem/saga-watem-build-${{ matrix.os }}
      options: --user 1001
    steps:
    - uses: actions/checkout@v7
    - name: run cmake
      shell: bash
      run: |
        mkdir build
        cd build
        cmake ..
        make
        IFS=':' read -r os release <<< '${{ matrix.os }}'
        zip "saga_watem_$release.zip" $(find . -name *.so) -j
        make DESTDIR=libs install
        mv libs/saga/lib* libs # normalizes the path, debian:trixie uses a different path
    - name: run tests
      run: |
        pytest-3 -vv
    - name: Set sanitized OS name
      id: os_name
      run: echo "sanitized_os=$(echo '${{ matrix.os }}' | sed 's/:/-/')" >> "$GITHUB_OUTPUT"

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v7
      with:
        name: Release zip files ${{ steps.os_name.outputs.sanitized_os  }}
        Path: build/*.zip
      
  linux-container-build-deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ["debian:trixie", "ubuntu:focal", "ubuntu:noble", "ubuntu:resolute"]
    container:
      image: ghcr.io/watem-sedem/saga-watem-build-${{ matrix.os }}
      options: --user 1001
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0
    - name: build deb packages
      shell: bash
      run: |
        IFS=':' read -r os release <<< '${{ matrix.os }}'
        SAGA_VER=$(dpkg-query -W -f='${Version}' libsaga-dev)
        SAGA_API_PKG=$(dpkg-query -W -f='${Depends}' libsaga-dev | grep -oP 'libsaga-api[^,( ]*')
        sed -e "s/@SAGA_VER@/$SAGA_VER/" -e "s/@SAGA_API_PKG@/$SAGA_API_PKG/" debian/control.in > debian/control
        dch --newversion $(git describe --tags)~$release  "autobuild $(git describe --tags)"
        fakeroot debian/rules binary
        mv ../*.deb .
    - name: Set sanitized OS name
      id: os_name
      run: echo "sanitized_os=$(echo '${{ matrix.os }}' | sed 's/:/-/')" >> "$GITHUB_OUTPUT"
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v7
      with:
        name: debian package ${{ steps.os_name.outputs.sanitized_os }}
        Path: "*.deb"

  linux-container-install-deb:
    needs: linux-container-build-deb
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ["debian:trixie", "ubuntu:focal", "ubuntu:noble", "ubuntu:resolute"]
    container:
      image: ${{ matrix.os }}
    steps:
    - name: Set sanitized OS name
      id: os_name
      run: echo "sanitized_os=$(echo '${{ matrix.os }}' | sed 's/:/-/')" >> "$GITHUB_OUTPUT"
    - name: 'Download Artifact'
      uses: actions/download-artifact@v8
      with:
        name: debian package ${{ steps.os_name.outputs.sanitized_os }}
    - name: sanity check - see if the install works
      shell: bash
      run: |
        apt-get update
        apt-get install -y ./*.deb
